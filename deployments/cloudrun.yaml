apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: redirect-service
  namespace: default
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "5"
        autoscaling.knative.dev/maxScale: "500"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 250
      timeoutSeconds: 10
      serviceAccountName: redirect-service@PROJECT_ID.iam.gserviceaccount.com
      containers:
      - name: redirect-service
        image: gcr.io/PROJECT_ID/redirect-service:latest
        ports:
        - name: http1
          containerPort: 8081
        resources:
          limits:
            cpu: "1000m"
            memory: "256Mi"
        env:
        - name: PORT
          value: "8081"
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-config
              key: host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-config
              key: password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-config
              key: replica_url
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
